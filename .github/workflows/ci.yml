name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Tests
      shell: bash
      run: |
        set -o pipefail
        python -m pytest -q --tb=short 2>&1 | tee pytest_output.txt

    - name: Report failures as annotations
      if: failure()
      shell: bash
      run: |
        echo "===== ملخص الإخفاقات (Failure Summary) ====="
        tail -40 pytest_output.txt || true
        grep -E "^(FAILED|ERROR)" pytest_output.txt | head -25 | while read -r line; do
          echo "::error::$line"
        done
